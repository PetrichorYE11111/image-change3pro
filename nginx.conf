server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Nano Banana Pro (gemini-3-pro-image) 生图微服务反代
    # 前端统一打 /layout-api/，由 nginx 转发给 layout-service 容器
    location /layout-api/ {
        proxy_pass http://layout-service:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }
}
